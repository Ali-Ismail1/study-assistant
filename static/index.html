<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Study Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background-color: #F8FAFC;
      color: #1E293B;
    }

    h1 {
      text-align: center;
      color: #1E40AF;
      margin-bottom: 25px;
    }

    h2 {
      color: #1D4ED8;
    }

    .upload-section {
      background-color: #EFF6FF;
      border: 2px dashed #BFDBFE;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-bottom: 30px;
    }

    .card-container {
      display: flex;        
      gap: 20px;            
      justify-content: space-between; 
      margin-bottom: 30px;
    }

    .card {
      flex: 1;               
      background-color: #EFF6FF;
      border: 1px solid #BFDBFE;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }

    .card button {
      background-color: #2563EB;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .card button:hover {
      background-color: #1D4ED8;
    }

    .output-section {
      background-color: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 20px;
      min-height: 150px;
    }
  </style>
</head>
<body>

  <header>
    <h1>AI Study Assistant</h1>
  </header>

  <main>
    <section class="upload-section">
      <label for="pdf_file"><strong>Upload Study Material (.pdf):</strong></label><br><br>
      <input type="file" id="pdf_file" accept=".pdf">
    </section>

    <h2>Study Tools</h2>
    
    <div class="card-container">
      <div class="card">
        <h3>Summary</h3>
        <p>Get a full detailed summary on the topic.</p>
        <button type="button" onclick="generateSummary()">Summarise file</button>
      </div>

      <div class="card">
        <h3>Quizzes</h3>
        <p>Master study material using generated quiz questions.</p>
        <button type="button" onclick="generateQuiz()">Generate Quiz</button>      
      </div>

      <div class="card">
        <h3>Key Concepts</h3>
        <p>Grasp the main key concepts behind the study material</p>
        <button type="button" onclick="generateKeyConcepts()">Extract Concepts</button>
      </div>
    </div>

    <section class="output-section">
      <h2>Generated Output</h2>
      <div id="result-content">
        <p>Select a file and click on any tool to view results here...</p>
      </div>
    </section>
  </main>
  <script>
    async function uploadFile() {
        const fileInput = document.getElementById('pdf_file');
        if (!fileInput.files[0]) return alert("Select a file first!");

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        const response = await fetch('http://127.0.0.1:8000/upload', { method: 'POST', body: formData });
        const data = await response.json();

        return data.session_id;
    }
    async function generateSummary() {
        const sessionId = await uploadFile();
        if (!sessionId) return;

        document.getElementById('result-content').innerText = "Generating summary, please wait...";
        const formData = new FormData();
        formData.append('session_id', sessionId);

        const response = await fetch('http://127.0.0.1:8000/summary', {
        method: 'POST',
        body: formData
        });
        const data = await response.json();
        if (!response.ok) {
            document.getElementById('result-content').innerText = "Error: " + (data.detail || "Something went wrong.");
            return;
        }
        document.getElementById('result-content').innerHTML = marked.parse(data.summary);    
    }

    async function generateQuiz() {
        const sessionId = await uploadFile();
        if (!sessionId) return;
        
        document.getElementById('result-content').innerText = "Generating Quiz, please wait...";
        const formData = new FormData();
        formData.append('session_id', sessionId);

        const response = await fetch('http://127.0.0.1:8000/quiz', {
        method: 'POST',
        body: formData
        });
        const data = await response.json();
        if (!response.ok) {
            document.getElementById('result-content').innerText = "Error: " + (data.detail || "Something went wrong.");
            return;
        }
        document.getElementById('result-content').innerHTML = marked.parse(data.quiz);    
    }

    async function generateKeyConcepts() {
        const sessionId = await uploadFile();
        if (!sessionId) return;

        document.getElementById('result-content').innerText = "Generating Key Concepts, please wait...";
        const formData = new FormData();
        formData.append('session_id', sessionId);

        const response = await fetch('http://127.0.0.1:8000/concepts', {
        method: 'POST',
        body: formData
        });
        const data = await response.json();
        if (!response.ok) {
            document.getElementById('result-content').innerText = "Error: " + (data.detail || "Something went wrong.");
            return;
        }
        document.getElementById('result-content').innerHTML = marked.parse(data.key_concepts);    
    }

  </script>
</body>
</html>
